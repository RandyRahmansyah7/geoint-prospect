[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geoint-engine"
version = "0.1.0"
description = "Analytical engine for GEOINT Prospect."
readme = "README.md"
# The engine runs on GitHub Actions runners (Python 3.12); local execution is not a
# supported runtime, so the versions pinned here describe the Actions environment.
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35",
  "duckdb>=1.1",
  "polars>=1.9",
  "pyarrow>=17",
  "pydantic>=2.7",
]

[project.optional-dependencies]
# pandera is optional: ingest/transform flows run without it. It is repeated in
# `dev` so the validation tests always run in CI. No `[polars]` extra, because that
# extra would pull the AVX2-only polars wheel over polars-lts-cpu.
validate = ["pandera>=0.20"]
dev = [
  "pandera>=0.20",
  "pytest>=8",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/geoint_prospect"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
