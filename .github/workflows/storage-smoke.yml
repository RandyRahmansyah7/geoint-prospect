name: Storage smoke test

# Manual proof that a configured provider really works: upload a tiny object, download it again,
# compare SHA-256, then remove it. Only touches the test/ namespace.
# Run it after filling in the provider secrets (docs/storage.md). Nothing here runs on push.

on:
  workflow_dispatch:
    inputs:
      providers:
        description: Provider(s) to smoke test
        required: true
        type: choice
        options:
          - b2
          - filebase
          - b2,filebase
      request_id:
        description: Id used for the test/ object key
        required: true
        type: string
      keep:
        description: Keep the test object instead of deleting it
        required: false
        default: false
        type: boolean

run-name: storage smoke ${{ inputs.request_id }}

permissions:
  contents: read

concurrency:
  group: storage-smoke-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml

      - name: Install engine
        run: pip install -e ./engine

      - name: Upload, read back, verify checksum, clean up
        env:
          PROVIDERS: ${{ inputs.providers }}
          REQUEST_ID: ${{ inputs.request_id }}
          KEEP: ${{ inputs.keep }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_REGION: ${{ secrets.B2_REGION }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          FILEBASE_ENDPOINT: ${{ secrets.FILEBASE_ENDPOINT }}
          FILEBASE_BUCKET: ${{ secrets.FILEBASE_BUCKET }}
          FILEBASE_REGION: ${{ secrets.FILEBASE_REGION }}
          FILEBASE_ACCESS_KEY: ${{ secrets.FILEBASE_ACCESS_KEY }}
          FILEBASE_SECRET_KEY: ${{ secrets.FILEBASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          args=(storage smoke --providers "$PROVIDERS" --request-id "$REQUEST_ID" --json)
          if [ "$KEEP" = "true" ]; then
            args+=(--keep)
          fi
          python -m geoint_prospect "${args[@]}" | tee "$RUNNER_TEMP/smoke.json"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Storage smoke test"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| request id | \`${{ inputs.request_id }}\` |"
            echo "| providers | \`${{ inputs.providers }}\` |"
            echo "| status | \`${{ job.status }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f "$RUNNER_TEMP/smoke.json" ]; then
            {
              echo ""
              echo "| provider | key | status | verified |"
              echo "| --- | --- | --- | --- |"
              jq -r '.data.results[]? | "| \(.provider) | \(.key) | \(.status) | \(.verified) |"' \
                "$RUNNER_TEMP/smoke.json"
              jq -r 'select(.ok == false) | "**error:** \(.error.message)"' "$RUNNER_TEMP/smoke.json"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
