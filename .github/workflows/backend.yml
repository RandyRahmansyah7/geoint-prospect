name: Backend job

# GitHub Actions is the only backend runtime: the desktop app asks the GitHub API to dispatch this
# workflow, and reads the run status back. Nothing in here runs on the workstation.
# See docs/backend-runtime.md for token scopes, storage secrets, and limits.

on:
  workflow_dispatch:
    inputs:
      pipeline:
        description: Registered engine pipeline to run
        required: true
        type: choice
        options:
          - healthcheck
          - tabular-normalize
          - ingest-tabular
      request_id:
        description: App-generated id used to match this run with the request
        required: true
        type: string
      input_path:
        description: Repository-relative path of the input dataset (tabular-normalize)
        required: false
        default: engine/tests/fixtures/observations.csv
        type: string
      source_id:
        description: Registered source id from configs/sources (ingest-tabular)
        required: false
        default: fixtures-observations
        type: string
      providers:
        description: Persistent storage, e.g. "b2" or "b2,filebase" (empty = publish nothing)
        required: false
        default: ""
        type: string
      store_raw:
        description: Also publish the acquired raw file (ingest-tabular only)
        required: false
        default: false
        type: boolean
      dry_run:
        description: Validate the request without processing or publishing anything
        required: false
        default: true
        type: boolean

run-name: backend ${{ inputs.request_id }}

# Only reading the repository: a pipeline never writes back to it.
permissions:
  contents: read

concurrency:
  # Same request id = same group, so an accidental double dispatch queues instead of running twice.
  group: backend-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  pipeline:
    name: ${{ inputs.pipeline }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PIPELINE: ${{ inputs.pipeline }}
      REQUEST_ID: ${{ inputs.request_id }}
      INPUT_PATH: ${{ inputs.input_path }}
      SOURCE_ID: ${{ inputs.source_id }}
      PROVIDERS: ${{ inputs.providers }}
      STORE_RAW: ${{ inputs.store_raw }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml

      - name: Install engine
        # Editable install: the engine runs from the checkout, so configs/sources and the
        # repository layout stay visible to it.
        run: pip install -e ./engine

      - name: Reject unsafe input paths
        run: |
          set -euo pipefail
          case "$INPUT_PATH" in
            /* | *..*)
              echo "input_path must be a repository-relative path without '..': $INPUT_PATH" >&2
              exit 2
              ;;
          esac

      # Provider secrets are scoped to this single step and never echoed. Publishing only happens
      # when the caller asked for a provider; an empty `providers` input publishes nothing.
      - name: Run pipeline through the engine CLI
        env:
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_REGION: ${{ secrets.B2_REGION }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          FILEBASE_ENDPOINT: ${{ secrets.FILEBASE_ENDPOINT }}
          FILEBASE_BUCKET: ${{ secrets.FILEBASE_BUCKET }}
          FILEBASE_REGION: ${{ secrets.FILEBASE_REGION }}
          FILEBASE_ACCESS_KEY: ${{ secrets.FILEBASE_ACCESS_KEY }}
          FILEBASE_SECRET_KEY: ${{ secrets.FILEBASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          # $RUNNER_TEMP is available in the shell; the publish step rebuilds the same path.
          OUTPUT_PATH="$RUNNER_TEMP/geoint/$REQUEST_ID.parquet"
          args=(run --pipeline "$PIPELINE" --request-id "$REQUEST_ID" --input "$INPUT_PATH" \
                --output "$OUTPUT_PATH" --json)
          if [ -n "${SOURCE_ID:-}" ]; then
            args+=(--source-id "$SOURCE_ID")
          fi
          if [ -n "${PROVIDERS:-}" ]; then
            args+=(--publish "$PROVIDERS")
            if [ "$STORE_RAW" = "true" ]; then
              args+=(--store-raw)
            fi
          fi
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          python -m geoint_prospect "${args[@]}" | tee "$RUNNER_TEMP/result.json"

      # Publishing happens inside the engine CLI (geoint_prospect.storage), not with ad-hoc CLI
      # calls here. Artifacts below are debugging/transfer only — never permanent storage.
      - name: Upload debug artifact
        if: ${{ inputs.dry_run == false }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-${{ inputs.request_id }}
          path: |
            ${{ runner.temp }}/geoint/*.parquet
            ${{ runner.temp }}/geoint/*.manifest.json
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          {
            echo "### Backend job"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| request id | \`$REQUEST_ID\` |"
            echo "| pipeline | \`$PIPELINE\` |"
            echo "| source id | \`${SOURCE_ID:-—}\` |"
            echo "| dry run | \`$DRY_RUN\` |"
            echo "| status | \`${{ job.status }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f "$RUNNER_TEMP/result.json" ]; then
            {
              echo ""
              echo "| stage | status |"
              echo "| --- | --- |"
              jq -r '.data.stages[]? | "| \(.stage) | \(.status) |"' "$RUNNER_TEMP/result.json"
              echo ""
              echo "| storage target | key | status |"
              echo "| --- | --- | --- |"
              jq -r '.data.storage.results[]? | "| \(.provider) | \(.key) | \(.status) |"' "$RUNNER_TEMP/result.json"
              jq -r 'select(.data.storage.enabled == false) | "storage: not requested (debug artifact only)"' "$RUNNER_TEMP/result.json"
              jq -r 'select(.ok == false) | "**error:** \(.error.message)"' "$RUNNER_TEMP/result.json"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "Artifacts (when not a dry run) are debug-only and expire after 7 days; staging files are removed by the engine." >> "$GITHUB_STEP_SUMMARY"
